<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chief of Staff</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f13;
    --bg2: #1a1a22;
    --bg3: #22222e;
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --text2: rgba(255,255,255,0.55);
    --text3: rgba(255,255,255,0.3);
    --blue: #4f8ef7;
    --blue-bg: rgba(79,142,247,0.12);
    --green: #34d399;
    --green-bg: rgba(52,211,153,0.12);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.12);
    --yellow: #fbbf24;
    --yellow-bg: rgba(251,191,36,0.12);
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,0.12);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* NAV */
  .nav {
    display: flex;
    background: var(--bg2);
    border-top: 0.5px solid var(--border);
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 0 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    font-size: 10px;
    transition: color 0.2s;
  }
  .nav-btn.active { color: var(--blue); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* SCREENS */
  .screen { display: none; padding: 16px 16px 90px; }
  .screen.active { display: block; }

  /* HEADER */
  .header { margin-bottom: 20px; }
  .header-date { font-size: 13px; color: var(--text3); margin-bottom: 4px; }
  .header-title { font-size: 24px; font-weight: 700; }

  /* STAT CARDS */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat-card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-value.blue { color: var(--blue); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.yellow { color: var(--yellow); }

  /* SECTION */
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }

  /* CARDS */
  .card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .card:active { background: var(--bg3); }
  .card-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--text2); }
  .card-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  /* BADGES */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge.blue   { background: var(--blue-bg);   color: var(--blue); }
  .badge.green  { background: var(--green-bg);  color: var(--green); }
  .badge.red    { background: var(--red-bg);    color: var(--red); }
  .badge.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .badge.purple { background: var(--purple-bg); color: var(--purple); }

  /* TIME BADGE */
  .time-badge {
    background: var(--blue-bg);
    color: var(--blue);
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; }

  /* LOADING */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text3);
    gap: 10px;
    font-size: 14px;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MODAL */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg2);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .modal-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-row-label { font-size: 13px; color: var(--text3); width: 90px; flex-shrink: 0; }
  .modal-row-value { font-size: 14px; color: var(--text); flex: 1; }

  /* STATUS BUTTONS */
  .status-btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .status-btn {
    flex: 1;
    min-width: 80px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }
  .status-btn:active { background: var(--bg); }
  .status-btn.green { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .status-btn.blue  { background: var(--blue-bg);  border-color: var(--blue);  color: var(--blue); }
  .status-btn.yellow{ background: var(--yellow-bg);border-color: var(--yellow);color: var(--yellow); }

  /* FORM */
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
  }
  .form-input:focus { border-color: var(--blue); }
  .form-select {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    appearance: none;
  }
  .submit-btn {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s;
  }
  .submit-btn:active { opacity: 0.85; }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 52px; height: 52px;
    background: var(--blue);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(79,142,247,0.4);
    z-index: 99;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.93); }
  .fab svg { width: 24px; height: 24px; }

  /* DIVIDER */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e293b;
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="screen-home" class="screen active"></div>
<div id="screen-tasks" class="screen"></div>
<div id="screen-meetings" class="screen"></div>
<div id="screen-trips" class="screen"></div>
<div id="screen-reminders" class="screen"></div>

<nav class="nav">
  <button class="nav-btn active" onclick="switchScreen('home')" id="nav-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    Главная
  </button>
  <button class="nav-btn" onclick="switchScreen('meetings')" id="nav-meetings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Встречи
  </button>
  <button class="nav-btn" onclick="switchScreen('tasks')" id="nav-tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    Задачи
  </button>
  <button class="nav-btn" onclick="switchScreen('trips')" id="nav-trips">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.8 19.8 0 01-8.63-3.07A19.5 19.5 0 013.07 8.81 19.8 19.8 0 01.07 2.18 2 2 0 012.03 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    Поездки
  </button>
  <button class="nav-btn" onclick="switchScreen('reminders')" id="nav-reminders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    Напомин.
  </button>
</nav>

<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <div class="modal-handle"></div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ВАША НОВАЯ ССЫЛКА ЗДЕСЬ
const BACKEND = "https://script.google.com/macros/s/AKfycbxd2xIfaA1OardShpQPmWqrcCVH_SOIa8YUiOn8Ip-jx9_7WVcs9kbbXSKmuKXI9OwAvg/exec";

// Init Telegram
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// State
let data = { meetings: [], tasks: [], reminders: [], trips: [] };
let loaded = false;

// ── NAVIGATION ──────────────────────────────────────────

function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');

  // Remove FAB
  const fab = document.getElementById('fab');
  if (fab) fab.remove();

  if (name === 'home')      renderHome();
  if (name === 'meetings')  renderMeetings();
  if (name === 'tasks')     renderTasks();
  if (name === 'trips')     renderTrips();
  if (name === 'reminders') renderReminders();
}

// ── DATA ────────────────────────────────────────────────

async function loadData() {
  try {
    // ДОБАВЛЕНО ?t=... ДЛЯ ЗАЩИТЫ ОТ КЭША ТЕЛЕГРАМА
    const res = await fetch(BACKEND + "?action=getData&t=" + Date.now());
    const json = await res.json();
    if (json.ok) {
      data = json.data;
      loaded = true;
    }
  } catch(e) {
    console.log("Load error:", e);
  }
}

// ── HOME ────────────────────────────────────────────────

async function renderHome() {
  const el = document.getElementById('screen-home');
  el.innerHTML = `<div class="loading"><div class="spinner"></div>Загрузка...</div>`;
  await loadData();

  const today = getTodayStr();
  const todayMeetings = data.meetings.filter(m => m.date === today);
  const activeTasks   = data.tasks.filter(t => t.status !== 'Готово' && t.status !== '✅ Готово');
  const urgentTasks   = activeTasks.filter(t => t.priority && t.priority.includes('Высокий'));
  const upcomingTrips = data.trips.filter(t => t.status !== 'Завершена');

  const dateStr = new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });

  el.innerHTML = `
    <div class="header">
      <div class="header-date">${dateStr}</div>
      <div class="header-title">Доброе утро 👋</div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Встречи сегодня</div>
        <div class="stat-value blue">${todayMeetings.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Активных задач</div>
        <div class="stat-value ${activeTasks.length > 0 ? 'yellow' : 'green'}">${activeTasks.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Горящих задач</div>
        <div class="stat-value ${urgentTasks.length > 0 ? 'red' : 'green'}">${urgentTasks.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Поездки</div>
        <div class="stat-value purple">${upcomingTrips.length}</div>
      </div>
    </div>

    ${todayMeetings.length > 0 ? `
      <div class="section-title">Встречи сегодня</div>
      ${todayMeetings.map(m => meetingCard(m)).join('')}
      <div class="divider"></div>
    ` : ''}

    ${urgentTasks.length > 0 ? `
      <div class="section-title">🔴 Горящие задачи</div>
      ${urgentTasks.slice(0,3).map(t => taskCard(t)).join('')}
    ` : ''}
  `;
}

// ── MEETINGS ────────────────────────────────────────────

async function renderMeetings() {
  const el = document.getElementById('screen-meetings');
  el.innerHTML = `<div class="loading"><div class="spinner"></div>Загрузка...</div>`;
  if (!loaded) await loadData();

  const today = getTodayStr();
  const todayM    = data.meetings.filter(m => m.date === today);
  const upcomingM = data.meetings.filter(m => m.date > today);
  const pastM     = data.meetings.filter(m => m.date < today);

  let html = `<div class="header"><div class="header-title">📅 Встречи</div></div>`;

  if (todayM.length > 0) {
    html += `<div class="section-title">Сегодня</div>`;
    html += todayM.map(m => meetingCard(m)).join('');
  }
  if (upcomingM.length > 0) {
    html += `<div class="section-title" style="margin-top:20px">Предстоящие</div>`;
    html += upcomingM.slice(0,10).map(m => meetingCard(m)).join('');
  }
  if (pastM.length > 0) {
    html += `<div class="section-title" style="margin-top:20px">Прошедшие</div>`;
    html += pastM.slice(-5).reverse().map(m => meetingCard(m, true)).join('');
  }
  if (data.meetings.length === 0) {
    html += `<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Встреч нет</div></div>`;
  }

  el.innerHTML = html;
  addFab(() => openAddMeeting());
}

function meetingCard(m, past) {
  const statusColor = past ? 'text3' : 'blue';
  return `<div class="card" onclick="openMeeting(${JSON.stringify(m).replace(/"/g, '&quot;')})">
    <div class="card-row">
      <div style="flex:1">
        <div class="card-name">${m.name || '—'}</div>
        <div class="card-sub">${m.participants || ''}</div>
      </div>
      ${m.time ? `<div class="time-badge">${m.time}</div>` : ''}
    </div>
    <div class="card-meta">
      ${m.date ? `<span class="badge blue">📅 ${m.date}</span>` : ''}
      ${m.status ? `<span class="badge ${past ? 'purple' : 'green'}">${m.status}</span>` : ''}
    </div>
  </div>`;
}

// ── TASKS ────────────────────────────────────────────────

async function renderTasks() {
  const el = document.getElementById('screen-tasks');
  el.innerHTML = `<div class="loading"><div class="spinner"></div>Загрузка...</div>`;
  if (!loaded) await loadData();

  const active = data.tasks.filter(t => t.status !== 'Готово' && t.status !== '✅ Готово');
  const done   = data.tasks.filter(t => t.status === 'Готово' || t.status === '✅ Готово');

  let html = `<div class="header"><div class="header-title">✅ Задачи</div></div>`;

  const urgent = active.filter(t => t.priority && t.priority.includes('Высокий'));
  const normal = active.filter(t => !t.priority || !t.priority.includes('Высокий'));

  if (urgent.length > 0) {
    html += `<div class="section-title">🔴 Высокий приоритет</div>`;
    html += urgent.map(t => taskCard(t)).join('');
  }
  if (normal.length > 0) {
    html += `<div class="section-title" style="margin-top:16px">В работе</div>`;
    html += normal.map(t => taskCard(t)).join('');
  }
  if (done.length > 0) {
    html += `<div class="section-title" style="margin-top:16px">✅ Завершено (${done.length})</div>`;
    html += done.slice(-3).reverse().map(t => taskCard(t)).join('');
  }
  if (data.tasks.length === 0) {
    html += `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Задач нет</div></div>`;
  }

  el.innerHTML = html;
  addFab(() => openAddTask());
}

function taskCard(t) {
  const prioColor = t.priority && t.priority.includes('Высокий') ? 'red' : t.priority && t.priority.includes('Средний') ? 'yellow' : 'green';
  const statusColor = (t.status === 'Готово' || t.status === '✅ Готово') ? 'green' : t.status === '🔄 В работе' || t.status === 'В работе' ? 'blue' : 'purple';
  return `<div class="card" onclick="openTask(${JSON.stringify(t).replace(/"/g, '&quot;')})">
    <div class="card-name">${t.name || '—'}</div>
    ${t.owner ? `<div class="card-sub">👤 ${t.owner}</div>` : ''}
    <div class="card-meta">
      ${t.deadline ? `<span class="badge yellow">📅 ${t.deadline}</span>` : ''}
      ${t.priority ? `<span class="badge ${prioColor}">${t.priority}</span>` : ''}
      ${t.status ? `<span class="badge ${statusColor}">${t.status}</span>` : ''}
    </div>
  </div>`;
}

// ── TRIPS ────────────────────────────────────────────────

async function renderTrips() {
  const el = document.getElementById('screen-trips');
  el.innerHTML = `<div class="loading"><div class="spinner"></div>Загрузка...</div>`;
  if (!loaded) await loadData();

  let html = `<div class="header"><div class="header-title">✈️ Командировки</div></div>`;

  if (data.trips.length === 0) {
    html += `<div class="empty"><div class="empty-icon">✈️</div><div class="empty-text">Командировок нет</div></div>`;
  } else {
    data.trips.forEach(t => {
      html += `<div class="card" onclick="openTrip(${JSON.stringify(t).replace(/"/g, '&quot;')})">
        <div class="card-name">📍 ${t.direction || '—'}</div>
        <div class="card-meta" style="margin-top:8px">
          ${t.departure ? `<span class="badge blue">✈️ ${t.departure}</span>` : ''}
          ${t.returnDate ? `<span class="badge purple">🏠 ${t.returnDate}</span>` : ''}
          ${t.status ? `<span class="badge green">${t.status}</span>` : ''}
        </div>
        ${t.hotel ? `<div class="card-sub" style="margin-top:8px">🏨 ${t.hotel}</div>` : ''}
      </div>`;
    });
  }

  el.innerHTML = html;
}

// ── REMINDERS ────────────────────────────────────────────

async function renderReminders() {
  const el = document.getElementById('screen-reminders');
  el.innerHTML = `<div class="loading"><div class="spinner"></div>Загрузка...</div>`;
  if (!loaded) await loadData();

  let html = `<div class="header"><div class="header-title">🔔 Напоминания</div></div>`;

  if (data.reminders.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🔔</div><div class="empty-text">Напоминаний нет</div></div>`;
  } else {
    data.reminders.forEach(r => {
      html += `<div class="card">
        <div class="card-name">${r.text || '—'}</div>
        <div class="card-meta">
          ${r.datetime ? `<span class="badge blue">🕐 ${r.datetime}</span>` : ''}
          ${r.status ? `<span class="badge green">${r.status}</span>` : ''}
        </div>
      </div>`;
    });
  }

  el.innerHTML = html;
  addFab(() => openAddReminder());
}

// ── MODALS ────────────────────────────────────────────────

function openMeeting(m) {
  const linkBtn = m.link ? `<a href="${m.link}" style="display:block;background:var(--blue-bg);color:var(--blue);padding:12px;border-radius:var(--radius-sm);text-align:center;text-decoration:none;font-weight:600;margin-top:16px">🔗 Открыть ссылку</a>` : '';
  showModal(`
    <div class="modal-title">${m.name || 'Встреча'}</div>
    ${row('📅 Дата', m.date)}
    ${row('⏰ Время', m.time)}
    ${row('👥 Участники', m.participants)}
    ${row('📍 Место', m.link)}
    ${row('📊 Статус', m.status)}
    ${linkBtn}
  `);
}

function openTask(t) {
  showModal(`
    <div class="modal-title">${t.name || 'Задача'}</div>
    ${row('📅 Дедлайн', t.deadline)}
    ${row('🎯 Приоритет', t.priority)}
    ${row('📊 Статус', t.status)}
    ${row('👤 Ответственный', t.owner)}
    ${row('💬 Комментарий', t.comment)}
    <div class="status-btns">
      <button class="status-btn green" onclick="updateStatus(${JSON.stringify(t).replace(/"/g, '&quot;')}, 'Готово')">✅ Готово</button>
      <button class="status-btn blue"  onclick="updateStatus(${JSON.stringify(t).replace(/"/g, '&quot;')}, 'В работе')">🔄 В работе</button>
      <button class="status-btn yellow" onclick="updateStatus(${JSON.stringify(t).replace(/"/g, '&quot;')}, 'Отложено')">⏸ Отложить</button>
    </div>
  `);
}

function openTrip(t) {
  showModal(`
    <div class="modal-title">✈️ ${t.direction || 'Командировка'}</div>
    ${row('✈️ Вылет', t.departure)}
    ${row('🏠 Возврат', t.returnDate)}
    ${row('🏨 Гостиница', t.hotel)}
    ${row('📊 Статус', t.status)}
  `);
}

function openAddTask() {
  showModal(`
    <div class="modal-title">Новая задача</div>
    <div class="form-group">
      <label class="form-label">Название *</label>
      <input class="form-input" id="add-task-name" placeholder="Что нужно сделать?" />
    </div>
    <div class="form-group">
      <label class="form-label">Дедлайн</label>
      <input class="form-input" id="add-task-deadline" type="date" />
    </div>
    <div class="form-group">
      <label class="form-label">Приоритет</label>
      <select class="form-select" id="add-task-priority">
        <option>🔴 Высокий</option>
        <option selected>🟡 Средний</option>
        <option>🟢 Низкий</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Ответственный</label>
      <input class="form-input" id="add-task-owner" placeholder="Имя" />
    </div>
    <button class="submit-btn" onclick="submitTask()">Добавить задачу</button>
  `);
}

function openAddMeeting() {
  showModal(`
    <div class="modal-title">Новая встреча</div>
    <div class="form-group">
      <label class="form-label">Название *</label>
      <input class="form-input" id="add-meeting-name" placeholder="Название встречи" />
    </div>
    <div class="form-group">
      <label class="form-label">Дата</label>
      <input class="form-input" id="add-meeting-date" type="date" />
    </div>
    <div class="form-group">
      <label class="form-label">Время</label>
      <input class="form-input" id="add-meeting-time" type="time" />
    </div>
    <div class="form-group">
      <label class="form-label">Участники</label>
      <input class="form-input" id="add-meeting-participants" placeholder="Иванов, Петров..." />
    </div>
    <div class="form-group">
      <label class="form-label">Ссылка</label>
      <input class="form-input" id="add-meeting-link" placeholder="https://..." />
    </div>
    <button class="submit-btn" onclick="submitMeeting()">Добавить встречу</button>
  `);
}

function openAddReminder() {
  showModal(`
    <div class="modal-title">Новое напоминание</div>
    <div class="form-group">
      <label class="form-label">Текст *</label>
      <input class="form-input" id="add-reminder-text" placeholder="О чём напомнить?" />
    </div>
    <div class="form-group">
      <label class="form-label">Дата и время</label>
      <input class="form-input" id="add-reminder-dt" type="datetime-local" />
    </div>
    <button class="submit-btn" onclick="submitReminder()">Добавить напоминание</button>
  `);
}

// ── SUBMIT ────────────────────────────────────────────────

async function updateStatus(task, newStatus) {
  closeModal();
  showToast('Обновляем статус...');
  try {
    await fetch(BACKEND, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateTaskStatus', row: task._row, status: newStatus })
    });
    loaded = false;
    showToast('✅ Статус обновлён!');
    setTimeout(() => renderTasks(), 500);
  } catch(e) {
    showToast('Ошибка обновления');
  }
}

async function submitTask() {
  const name = document.getElementById('add-task-name').value.trim();
  if (!name) { showToast('Введите название'); return; }
  const task = {
    name,
    deadline: document.getElementById('add-task-deadline').value,
    priority: document.getElementById('add-task-priority').value,
    owner: document.getElementById('add-task-owner').value,
    status: 'Новая'
  };
  closeModal();
  showToast('Добавляем задачу...');
  try {
    await fetch(BACKEND, { method: 'POST', body: JSON.stringify({ action: 'addTask', task }) });
    loaded = false;
    showToast('✅ Задача добавлена!');
    setTimeout(() => renderTasks(), 500);
  } catch(e) { showToast('Ошибка добавления'); }
}

async function submitMeeting() {
  const name = document.getElementById('add-meeting-name').value.trim();
  if (!name) { showToast('Введите название'); return; }
  const meeting = {
    name,
    date: document.getElementById('add-meeting-date').value,
    time: document.getElementById('add-meeting-time').value,
    participants: document.getElementById('add-meeting-participants').value,
    link: document.getElementById('add-meeting-link').value,
    status: 'Запланирована'
  };
  closeModal();
  showToast('Добавляем встречу...');
  try {
    await fetch(BACKEND, { method: 'POST', body: JSON.stringify({ action: 'addMeeting', meeting }) });
    loaded = false;
    showToast('✅ Встреча добавлена!');
    setTimeout(() => renderMeetings(), 500);
  } catch(e) { showToast('Ошибка добавления'); }
}

async function submitReminder() {
  const text = document.getElementById('add-reminder-text').value.trim();
  if (!text) { showToast('Введите текст'); return; }
  const reminder = {
    text,
    datetime: document.getElementById('add-reminder-dt').value,
    status: 'Активно'
  };
  closeModal();
  showToast('Добавляем напоминание...');
  try {
    await fetch(BACKEND, { method: 'POST', body: JSON.stringify({ action: 'addReminder', reminder }) });
    loaded = false;
    showToast('✅ Напоминание добавлено!');
    setTimeout(() => renderReminders(), 500);
  } catch(e) { showToast('Ошибка добавления'); }
}

// ── UTILS ────────────────────────────────────────────────

function row(label, value) {
  if (!value) return '';
  return `<div class="modal-row">
    <div class="modal-row-label">${label}</div>
    <div class="modal-row-value">${value}</div>
  </div>`;
}

function showModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-backdrop')) {
    document.getElementById('modal-backdrop').classList.remove('open');
  }
}

function addFab(onClick) {
  const fab = document.createElement('button');
  fab.className = 'fab';
  fab.id = 'fab';
  fab.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
  fab.onclick = onClick;
  document.body.appendChild(fab);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function getTodayStr() {
  const d = new Date();
  return String(d.getDate()).padStart(2,'0') + '.' +
    String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}

// Start
renderHome();
</script>
